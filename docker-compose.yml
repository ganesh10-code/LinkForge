name: linkforge

services:
  postgres:
    image: postgres:15-alpine
    container_name: linkforge-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-linkforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Url-Shortner-sb
    container_name: linkforge-backend
    restart: always
    ports:
      - "9090:9090"
    environment:
      # Explicit overrides for Docker internal networking
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-linkforge}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost
      # Passed through from root .env implicitly or explicitly
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-172800000}
      - PORT=${PORT:-9090}
      - REDIS_DEFAULT_TTL_DAYS=${REDIS_DEFAULT_TTL_DAYS:-7}
      - ASYNC_CORE_POOL_SIZE=${ASYNC_CORE_POOL_SIZE:-2}
      - ASYNC_MAX_POOL_SIZE=${ASYNC_MAX_POOL_SIZE:-10}
      - ASYNC_QUEUE_CAPACITY=${ASYNC_QUEUE_CAPACITY:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend:
    build:
      context: ./Url-Shortner-Frontend
    container_name: linkforge-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
