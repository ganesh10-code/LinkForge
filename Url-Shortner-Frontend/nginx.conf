server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Explicitly serve index.html for root path
    location = / {
        try_files /index.html =404;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle React Router specific paths (SPA)
    # These paths should return index.html so React can handle the routing on the client side
    location ~ ^/(login|register|dashboard|about|error|assets/) {
        try_files $uri $uri/ /index.html;
    }
    
    # Redirect Short URLs directly to the backend
    location /s/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle common static files to prevent unnecessary backend requests for missing assets
    location ~* \.(ico|json|png|jpg|jpeg|svg|txt)$ {
        try_files $uri =404;
    }

    # Fallback for anything else is handled by backend
    location / {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
