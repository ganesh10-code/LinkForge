spring:
  application:
    name: Url-Shortner-sb
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

server:
  port: ${PORT:9090}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:172800000}

frontend:
  url: ${FRONTEND_URL}
